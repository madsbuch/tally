[package]
name = "tauri-plugin-sync-background"
version = "0.1.0"
description = "Periodic background sync on Android (WorkManager), calling back into the app's Rust sync"
edition = "2021"
links = "tauri-plugin-sync-background"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[lints.rust]
# No unsafe Rust anywhere in Tally; see CLAUDE.md.
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(mobile)',
  'cfg(desktop)',
] }
